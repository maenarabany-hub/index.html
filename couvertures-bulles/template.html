<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wdth,wght@1,62.5..100,300..600&family=Archivo:wdth,wght@112,500&display=block" rel="stylesheet">
<style>
:root{--fond:#E6D8C6;--cerise:#8B5E3C;--rose:#4A3226;--blanc:#FFF8F0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--fond)}
.c{width:1080px;height:1920px;position:relative;background:radial-gradient(circle at 50% 50%,#F4ECE2 0 25%,var(--fond) 55%)}
.ring{position:absolute;left:50%;top:50%;width:780px;height:780px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--rose);opacity:.55}
.in{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:900px;display:flex;flex-direction:column;align-items:center}
.ic{height:240px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:30px}
.ic svg{height:235px;width:auto}
.tag{font-family:'CY Grotesk','Archivo',sans-serif;font-stretch:112%;font-weight:500;font-size:72px;color:var(--blanc);background:var(--cerise);padding:12px 30px 10px;text-transform:uppercase;letter-spacing:-.5px;position:relative;z-index:2;margin-bottom:-52px}
.w{font-family:'Noto Serif',serif;font-style:italic;font-weight:400;font-variation-settings:'wdth' 70;color:var(--rose);line-height:1;letter-spacing:-4px;text-transform:uppercase;white-space:nowrap}
</style></head><body><div class="c">
<div class="in"><div class="ic">__ICON__</div><div class="tag">__TAG__</div><div class="w" style="font-size:__SIZE__px">__WORD__</div></div></div></body></html>
